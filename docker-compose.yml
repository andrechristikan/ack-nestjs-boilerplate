name: ack-nestjs-boilerplate

services:
    apis:
        build:
            context: .
            dockerfile: dockerfile
        hostname: apis
        ports:
            - 3000:3000
        volumes:
            - type: bind
              source: ./src
              target: /app/src
              bind:
                  create_host_path: false
            - type: bind
              source: ./prisma
              target: /app/prisma
              bind:
                  create_host_path: false
            - type: bind
              source: ./.env
              target: /app/.env
              read_only: true
              bind:
                  create_host_path: false
        restart: on-failure
        networks:
            - app-network
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        depends_on:
            redis:
                condition: service_healthy
            mongo:
                condition: service_healthy
            jwks-server:
                condition: service_healthy
        healthcheck:
            test:
                [
                    'CMD',
                    'wget',
                    '--no-verbose',
                    '--tries=1',
                    '--spider',
                    'http://127.0.0.1:3000/api/public/hello',
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s
        profiles: ['apis']
        deploy:
            resources:
                limits:
                    cpus: '1'
                    memory: 2G

    jwks-server:
        image: nginx:alpine
        hostname: jwks-server
        ports:
            - '3011:80'
        volumes:
            - type: bind
              source: ./keys/access-jwks.json
              target: /usr/share/nginx/html/.well-known/access-jwks.json
              read_only: true
              bind:
                  create_host_path: false
            - type: bind
              source: ./keys/refresh-jwks.json
              target: /usr/share/nginx/html/.well-known/refresh-jwks.json
              read_only: true
              bind:
                  create_host_path: false
            - type: bind
              source: ./ci/jwks-server/jwks.conf
              target: /etc/nginx/conf.d/default.conf
              read_only: true
              bind:
                  create_host_path: false
        networks:
            - app-network
        deploy:
            resources:
                limits:
                    cpus: '0.3'
                    memory: 128M
        healthcheck:
            test:
                [
                    'CMD',
                    'wget',
                    '-q',
                    '--spider',
                    'http://localhost:80/.well-known/access-jwks.json',
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s

    vault:
        image: hashicorp/vault:latest
        hostname: vault
        profiles: ['vault']
        cap_add:
            - IPC_LOCK
        ports:
            - '8200:8200'
        entrypoint: ['/bin/sh', '/vault/entrypoint.sh']
        volumes:
            - type: bind
              source: ./ci/vault/entrypoint.sh
              target: /vault/entrypoint.sh
              read_only: true
              bind:
                  create_host_path: false
            - type: bind
              source: ./ci/vault/config.hcl
              target: /vault/config.hcl
              read_only: true
              bind:
                  create_host_path: false
            - type: volume
              source: vault_data
              target: /vault/file
            - type: bind
              source: ./generated/vault
              target: /vault/init
              bind:
                  create_host_path: true
        networks:
            vault-network:
                aliases:
                    - vault
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    "wget -q -O- 'http://127.0.0.1:8200/v1/sys/health?standbycode=200' >/dev/null 2>&1 || exit 1",
                ]
            interval: 5s
            timeout: 3s
            retries: 15
            start_period: 5s

    vault-bootstrap:
        image: hashicorp/vault:latest
        profiles: ['vault']
        entrypoint: ['/bin/sh', '/bootstrap.sh']
        environment:
            VAULT_ADDR: http://vault:8200
            KV_MOUNT: ack-nestjs-boilerplate
        volumes:
            - type: bind
              source: ./ci/vault/bootstrap.sh
              target: /bootstrap.sh
              read_only: true
              bind:
                  create_host_path: false
            - type: bind
              source: ./ci/vault/policies
              target: /policies
              read_only: true
              bind:
                  create_host_path: false
            - type: bind
              source: ./.env.example
              target: /seed/.env.example
              read_only: true
              bind:
                  create_host_path: false
            - type: bind
              source: ./generated/vault
              target: /vault/init
              bind:
                  create_host_path: true
        networks:
            - vault-network
        depends_on:
            vault:
                condition: service_healthy

    redis:
        image: redis:latest
        hostname: redis
        environment:
            REDIS_PASSWORD: ${DOCKER_REDIS_PASSWORD:-}
        user: redis
        command:
            [
                'sh',
                '-c',
                'if [ -n "$$REDIS_PASSWORD" ]; then exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"; fi; exec redis-server --appendonly yes',
            ]
        ports:
            - '6379:6379'
        volumes:
            - type: volume
              source: redis_data
              target: /data
        networks:
            - app-network
        deploy:
            resources:
                limits:
                    cpus: '0.5'
                    memory: 256M
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'if [ -n "$$REDIS_PASSWORD" ]; then export REDISCLI_AUTH="$$REDIS_PASSWORD"; fi; redis-cli ping | grep -q PONG',
                ]
            interval: 10s
            timeout: 30s
            retries: 5

    redis-bullboard:
        image: venatum/bull-board:latest
        hostname: redis-bullboard
        ports:
            - 3010:3000
        networks:
            - app-network
        environment:
            - REDIS_HOST=redis
            - REDIS_PORT=6379
            - REDIS_PASSWORD=${DOCKER_REDIS_PASSWORD:-}
            - BULL_PREFIX=Queue
            - USER_LOGIN=${DOCKER_BULLBOARD_USER:-admin}
            - USER_PASSWORD=${DOCKER_BULLBOARD_PASSWORD:-admin123}
            - REDIS_DB=1
        depends_on:
            redis:
                condition: service_healthy
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'wget -q --spider http://127.0.0.1:3000/login || exit 1',
                ]
            interval: 10s
            timeout: 30s
            retries: 5
        deploy:
            resources:
                limits:
                    cpus: '0.3'
                    memory: 128M

    mongo:
        image: mongo:latest
        hostname: mongo
        ports:
            - '${DOCKER_MONGO_PORT:-27017}:27017'
        environment:
            HOME: /tmp
            RS_HOST: host.docker.internal:${DOCKER_MONGO_PORT:-27017}
            MONGO_INITDB_ROOT_USERNAME: ${DOCKER_MONGO_ROOT_USERNAME:-root}
            MONGO_INITDB_ROOT_PASSWORD: ${DOCKER_MONGO_ROOT_PASSWORD:-}
        networks:
            - app-network
        volumes:
            - type: volume
              source: mongo_data
              target: /data/db
            - type: bind
              source: ./keys/mongo-keyfile
              target: /etc/mongo/keyfile
              read_only: true
              bind:
                  create_host_path: false
            - type: bind
              source: ./ci/mongo/entrypoint.sh
              target: /entrypoint.sh
              read_only: true
              bind:
                  create_host_path: false
        entrypoint: ['/bin/bash', '/entrypoint.sh']
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        deploy:
            resources:
                limits:
                    cpus: '1'
                    memory: 1GB
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'if [ -n "$$MONGO_INITDB_ROOT_PASSWORD" ]; then mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "quit(db.hello().isWritablePrimary ? 0 : 1)"; else mongosh --quiet --eval "quit(db.hello().isWritablePrimary ? 0 : 1)"; fi',
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 40s

volumes:
    mongo_data:
    redis_data:
    vault_data:

networks:
    app-network:
        driver: bridge
    vault-network:
        driver: bridge
