name: ack-nestjs-boilerplate

services:
    apis:
        build:
            context: .
            dockerfile: dockerfile
        hostname: apis
        environment:
            NODE_OPTIONS: --max-old-space-size=2048
        ports:
            - ${DOCKER_APIS_PORT:-3000}:3000
        volumes:
            - type: bind
              source: ./src
              target: /app/src
              bind:
                  create_host_path: false
            - type: tmpfs
              target: /app/src/generated
            - type: bind
              source: ./prisma
              target: /app/prisma
              bind:
                  create_host_path: false
            - type: bind
              source: ./.env
              target: /app/.env
              read_only: true
              bind:
                  create_host_path: false
        networks:
            - app-network
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        depends_on:
            redis-queue:
                condition: service_healthy
            redis-cache:
                condition: service_healthy
            postgres:
                condition: service_healthy
            jwks-server:
                condition: service_healthy
        healthcheck:
            test:
                [
                    'CMD',
                    'wget',
                    '--no-verbose',
                    '--tries=1',
                    '--spider',
                    'http://127.0.0.1:3000/api/public/hello',
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s
        profiles: ['apis']
        deploy:
            resources:
                limits:
                    cpus: '1'
                    memory: 4G

    jwks-server:
        profiles: ['deps']
        image: nginx:alpine
        hostname: jwks-server
        ports:
            - '3011:80'
        volumes:
            - type: bind
              source: ./keys/access-jwks.json
              target: /usr/share/nginx/html/.well-known/access-jwks.json
              read_only: true
              bind:
                  create_host_path: false
            - type: bind
              source: ./keys/refresh-jwks.json
              target: /usr/share/nginx/html/.well-known/refresh-jwks.json
              read_only: true
              bind:
                  create_host_path: false
            - type: bind
              source: ./ci/jwks-server/jwks.conf
              target: /etc/nginx/conf.d/default.conf
              read_only: true
              bind:
                  create_host_path: false
        networks:
            - app-network
        deploy:
            resources:
                limits:
                    cpus: '0.3'
                    memory: 128M
        healthcheck:
            test:
                [
                    'CMD',
                    'wget',
                    '-q',
                    '--spider',
                    'http://localhost:80/.well-known/access-jwks.json',
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s

    redis-queue:
        profiles: ['deps']
        image: redis:latest
        hostname: redis-queue
        environment:
            REDIS_PASSWORD: ${DOCKER_REDIS_PASSWORD:-}
        user: redis
        command:
            [
                'sh',
                '-c',
                'if [ -n "$$REDIS_PASSWORD" ]; then exec redis-server --appendonly yes --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"; fi; exec redis-server --appendonly yes --maxmemory-policy noeviction',
            ]
        ports:
            - '6379:6379'
        volumes:
            - type: volume
              source: redis_queue_data
              target: /data
        networks:
            - app-network
        deploy:
            resources:
                limits:
                    cpus: '0.5'
                    memory: 256M
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'if [ -n "$$REDIS_PASSWORD" ]; then export REDISCLI_AUTH="$$REDIS_PASSWORD"; fi; redis-cli ping | grep -q PONG',
                ]
            interval: 10s
            timeout: 30s
            retries: 5

    redis-cache:
        profiles: ['deps']
        image: redis:latest
        hostname: redis-cache
        environment:
            REDIS_PASSWORD: ${DOCKER_REDIS_PASSWORD:-}
        user: redis
        command:
            [
                'sh',
                '-c',
                'if [ -n "$$REDIS_PASSWORD" ]; then exec redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save "" --appendonly no --requirepass "$$REDIS_PASSWORD"; fi; exec redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save "" --appendonly no',
            ]
        ports:
            - '6380:6379'
        networks:
            - app-network
        deploy:
            resources:
                limits:
                    cpus: '0.5'
                    memory: 384M
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'if [ -n "$$REDIS_PASSWORD" ]; then export REDISCLI_AUTH="$$REDIS_PASSWORD"; fi; redis-cli ping | grep -q PONG',
                ]
            interval: 10s
            timeout: 30s
            retries: 5

    bullboard:
        profiles: ['deps']
        image: venatum/bull-board:latest
        hostname: bullboard
        ports:
            - 3010:3000
        networks:
            - app-network
        environment:
            - REDIS_HOST=redis-queue
            - REDIS_PORT=6379
            - REDIS_PASSWORD=${DOCKER_REDIS_PASSWORD:-}
            - BULL_PREFIX=Queue
            - USER_LOGIN=${DOCKER_BULLBOARD_USERNAME:-admin}
            - USER_PASSWORD=${DOCKER_BULLBOARD_PASSWORD:-admin123}
            - REDIS_DB=0
        depends_on:
            redis-queue:
                condition: service_healthy
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'wget -q --spider http://127.0.0.1:3000/login || exit 1',
                ]
            interval: 10s
            timeout: 30s
            retries: 5
        deploy:
            resources:
                limits:
                    cpus: '0.3'
                    memory: 128M

    postgres:
        profiles: ['deps']
        image: postgres:18
        hostname: postgres
        ports:
            - '5432:5432'
        environment:
            POSTGRES_DB: ACKNestJs
            POSTGRES_USER: ack
            POSTGRES_PASSWORD: ack_password
        networks:
            - app-network
        volumes:
            - postgres_data:/var/lib/postgresql
        deploy:
            resources:
                limits:
                    cpus: '0.5'
                    memory: 512M
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -q -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"',
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

volumes:
    postgres_data:
    redis_queue_data:

networks:
    app-network:
        driver: bridge
