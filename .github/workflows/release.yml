name: Release
on:
    workflow_dispatch:
    # push:
    #     branches:
    #         - main
    #         - staging
    #         - development

permissions:
    contents: read

env:
    DOCKERFILE: ci/dockerfile

jobs:
    ci:
        uses: ./.github/workflows/ci.yml

    resolve:
        needs: [ci]
        if: contains(fromJSON('["main","staging","development"]'), github.ref_name)
        runs-on: ubuntu-latest
        outputs:
            environment: ${{ steps.environment.outputs.environment }}

        steps:
            - name: Resolve environment
              id: environment
              env:
                  REF_NAME: ${{ github.ref_name }}
              run: |
                  if [ "$REF_NAME" = "main" ]; then
                    echo "environment=production" >> "$GITHUB_OUTPUT"
                  else
                    echo "environment=$REF_NAME" >> "$GITHUB_OUTPUT"
                  fi

    build_image:
        needs: [resolve]
        runs-on: ubuntu-latest
        timeout-minutes: 30
        environment: ${{ needs.resolve.outputs.environment }}
        outputs:
            short_sha: ${{ steps.git.outputs.short_sha }}
        permissions:
            contents: read
            id-token: write

        steps:
            - name: Git checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Get short sha commit
              id: git
              run: |
                  echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

            - name: Get latest version
              id: version
              run: |
                  echo "current-version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

            - name: Log info
              env:
                  DEPLOY_ENVIRONMENT: ${{ needs.resolve.outputs.environment }}
                  SHORT_SHA: ${{ steps.git.outputs.short_sha }}
                  VERSION: ${{ steps.version.outputs.current-version }}
              run: |
                  echo "Environment is: $DEPLOY_ENVIRONMENT"
                  echo "Short sha: $SHORT_SHA"
                  echo "Version is: $VERSION"

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
              with:
                  role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
                  aws-region: ${{ vars.AWS_REGION }}

            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0

            - name: Application image metadata
              id: meta_app
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                  images: ${{ vars.AWS_ECR_REPOSITORY_URI }}
                  flavor: latest=false
                  tags: |
                      type=raw,value=sha-${{ steps.git.outputs.short_sha }}
                      type=raw,value=${{ needs.resolve.outputs.environment }}
                      type=raw,value=latest,enable=${{ needs.resolve.outputs.environment == 'production' }}

            - name: Build & Push application image
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  file: ${{ env.DOCKERFILE }}
                  push: true
                  tags: ${{ steps.meta_app.outputs.tags }}
                  labels: ${{ steps.meta_app.outputs.labels }}
                  provenance: true
                  sbom: true
                  cache-from: type=gha,scope=app
                  cache-to: type=gha,scope=app,mode=max

            - name: Migrate image metadata
              id: meta_migrate
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                  images: ${{ vars.AWS_ECR_REPOSITORY_URI }}
                  flavor: latest=false
                  tags: |
                      type=raw,value=migrate-sha-${{ steps.git.outputs.short_sha }}

            - name: Build & Push migrate image
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  file: ${{ env.DOCKERFILE }}
                  target: migrate
                  push: true
                  tags: ${{ steps.meta_migrate.outputs.tags }}
                  labels: ${{ steps.meta_migrate.outputs.labels }}
                  provenance: true
                  sbom: true
                  cache-from: type=gha,scope=migrate
                  cache-to: type=gha,scope=migrate,mode=max

    deploy:
        needs: [resolve, build_image]
        runs-on: ubuntu-latest
        timeout-minutes: 30
        environment: ${{ needs.resolve.outputs.environment }}
        concurrency:
            group: deploy-${{ needs.resolve.outputs.environment }}
            cancel-in-progress: false
        permissions:
            contents: read
            id-token: write

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
              with:
                  role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
                  aws-region: ${{ vars.AWS_REGION }}

            - name: Update AWS EC2 Instance
              env:
                  EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
                  AWS_ECR_REPOSITORY_URI: ${{ vars.AWS_ECR_REPOSITORY_URI }}
                  AWS_REGION: ${{ vars.AWS_REGION }}
                  DOCKER_CONTAINER_NAME: ${{ vars.DOCKER_CONTAINER_NAME }}
                  DOCKER_HOST_PORT: ${{ vars.DOCKER_HOST_PORT }}
                  SHORT_SHA: ${{ needs.build_image.outputs.short_sha }}
              run: |
                  PARAMETERS=$(jq -n \
                      --arg uri "$AWS_ECR_REPOSITORY_URI" \
                      --arg region "$AWS_REGION" \
                      --arg name "$DOCKER_CONTAINER_NAME" \
                      --arg port "$DOCKER_HOST_PORT" \
                      --arg short_sha "$SHORT_SHA" \
                      '{commands: [
                          "set -e",
                          "aws ecr get-login-password --region \($region) | docker login --username AWS --password-stdin \($uri)",
                          "docker pull \($uri):sha-\($short_sha)",
                          "docker pull \($uri):migrate-sha-\($short_sha)",
                          "docker run --rm --network app-network --user \"$(stat -c '\''%u:%g'\'' /home/ec2-user/\($name)/.env)\" --volume /home/ec2-user/\($name)/.env:/app/.env:ro \($uri):migrate-sha-\($short_sha)",
                          "docker rm -f \($name) 2>/dev/null || true",
                          "docker run -itd --hostname \($name) --publish 127.0.0.1:\($port):3000 --network app-network --user \"$(stat -c '\''%u:%g'\'' /home/ec2-user/\($name)/.env)\" --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true --memory 1g --cpus 1.0 --volume /home/ec2-user/\($name)/.env:/app/.env:ro --restart unless-stopped --name \($name) \($uri):sha-\($short_sha)",
                          "i=0; until curl -fsS -o /dev/null \"http://127.0.0.1:\($port)/api/public/hello\"; do i=$((i+1)); if [ \"$i\" -ge 30 ]; then echo \"probe: no answer from the application after 60 seconds\" >&2; exit 1; fi; sleep 2; done",
                          "docker image prune --all --force --filter until=24h"
                      ]}')
                  COMMAND_ID=$(aws ssm send-command \
                      --instance-ids "$EC2_INSTANCE_ID" \
                      --document-name "AWS-RunShellScript" \
                      --comment "Release new version" \
                      --parameters "$PARAMETERS" \
                      --query "Command.CommandId" \
                      --output text)
                  DEADLINE=$((SECONDS + 900))
                  STATUS=Pending
                  while [ "$SECONDS" -lt "$DEADLINE" ]; do
                      sleep 10
                      if ! STATUS=$(aws ssm get-command-invocation \
                          --command-id "$COMMAND_ID" \
                          --instance-id "$EC2_INSTANCE_ID" \
                          --query Status \
                          --output text 2>&1); then
                          case "$STATUS" in
                              *InvocationDoesNotExist*) STATUS=Pending ;;
                              *) echo "$STATUS" >&2; exit 1 ;;
                          esac
                      fi
                      case "$STATUS" in
                          Pending|InProgress|Delayed) ;;
                          *) break ;;
                      esac
                  done
                  aws ssm get-command-invocation \
                      --command-id "$COMMAND_ID" \
                      --instance-id "$EC2_INSTANCE_ID" \
                      --query "[StandardOutputContent, StandardErrorContent]" \
                      --output text
                  if [ "$STATUS" != "Success" ]; then
                      echo "SSM command ended in status: $STATUS" >&2
                      exit 1
                  fi
