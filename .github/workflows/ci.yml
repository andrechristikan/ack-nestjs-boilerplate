name: CI
on:
    workflow_call:
    workflow_dispatch:
    pull_request:
        branches:
            - main
            - staging
            - development
    push:
        branches:
            - main
            - staging
            - development

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    NODE_VERSION: lts/*

jobs:
    static:
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Git checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup pnpm
              uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

            - name: Setup node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Generate Client and Package Fields
              run: pnpm generate

            - name: Linter
              run: pnpm lint

            - name: Dead code
              run: pnpm deadcode

            - name: Spell
              run: pnpm spell

            - name: Docs lint
              run: pnpm lint:docs

    typecheck:
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Git checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup pnpm
              uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

            - name: Setup node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Generate Client and Package Fields
              run: pnpm generate

            - name: Typecheck
              run: pnpm typecheck

    build:
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Git checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup pnpm
              uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

            - name: Setup node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Generate Client and Package Fields
              run: pnpm generate

            - name: Build
              run: pnpm build

    dependency-review:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read

        steps:
            - name: Git checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Dependency review
              uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
              with:
                  fail-on-severity: high

    test-unit:
        needs: [static, typecheck, build]
        uses: ./.github/workflows/test-unit.yml

    test-integration:
        needs: [static, typecheck, build]
        uses: ./.github/workflows/test-integration.yml
