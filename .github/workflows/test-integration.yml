name: Integration Test
on:
    workflow_call:
    workflow_dispatch:

permissions:
    contents: read

env:
    NODE_VERSION: lts/*

jobs:
    integration:
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Git checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Detect suite
              id: suite
              run: |
                  if find test/integration -name '*.spec.ts' 2>/dev/null | grep -q .; then
                      echo "held=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "held=true" >> "$GITHUB_OUTPUT"
                      echo "::notice::Integration suite held: no spec under test/integration/"
                  fi

            - name: Setup pnpm
              uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
              if: steps.suite.outputs.held == 'false'

            - name: Setup node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              if: steps.suite.outputs.held == 'false'
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: pnpm

            - name: Install dependencies
              if: steps.suite.outputs.held == 'false'
              run: pnpm install --frozen-lockfile

            - name: Generate Client and Package Fields
              if: steps.suite.outputs.held == 'false'
              run: pnpm generate

            - name: Integration Test
              if: steps.suite.outputs.held == 'false'
              run: pnpm test:integration
              env:
                  CI: true
