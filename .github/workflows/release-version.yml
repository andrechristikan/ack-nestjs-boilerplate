name: ReleaseVersion

permissions:
    contents: read

on:
    workflow_dispatch:

env:
    NODE_VERSION: lts/*

jobs:
    ci:
        uses: ./.github/workflows/ci.yml

    release:
        needs: [ci]
        if: github.ref_name == 'main'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write

        steps:
            - name: Git checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Get short sha commit
              id: git
              run: |
                  echo "short_sha=$(git rev-parse --short "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

            - name: Get latest version
              id: version
              run: |
                  echo "current-version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

            - name: Log info
              env:
                  REF_NAME: ${{ github.ref_name }}
                  SHORT_SHA: ${{ steps.git.outputs.short_sha }}
                  VERSION: ${{ steps.version.outputs.current-version }}
              run: |
                  echo "Branch name is: $REF_NAME"
                  echo "Short sha: $SHORT_SHA"
                  echo "Version is: $VERSION"

            - name: Setup pnpm
              uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

            - name: Setup node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: pnpm

            - name: Build SBOM
              run: pnpm sbom --sbom-format cyclonedx --lockfile-only --prod --out sbom.cdx.json

            - name: Release
              uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  tag_name: v${{ steps.version.outputs.current-version }}
                  name: v${{ steps.version.outputs.current-version }}
                  generate_release_notes: true
                  draft: false
                  prerelease: false
                  files: sbom.cdx.json
