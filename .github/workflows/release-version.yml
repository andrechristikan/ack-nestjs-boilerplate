name: ReleaseVersion

permissions:
    contents: write

on:
    workflow_dispatch:

env:
    NODE_VERSION: lts/*

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - name: Git checkout
              uses: actions/checkout@v7

            - name: Get short sha commit
              id: git
              run: |
                  echo "short_sha=$(git rev-parse --short $GITHUB_SHA)" >> "$GITHUB_OUTPUT"

            - name: Get latest version
              id: version
              uses: martinbeentjes/npm-get-version-action@v1

            - name: Log info
              run: |
                  echo Branch name is: ${{ github.ref_name }}
                  echo Short sha: ${{ steps.git.outputs.short_sha }}
                  echo Version is: ${{ steps.version.outputs.current-version }}

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup node
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: pnpm

            - name: Build SBOM
              run: pnpm sbom --sbom-format cyclonedx --lockfile-only --prod --out sbom.cdx.json

            - name: Release
              uses: softprops/action-gh-release@v3
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  tag_name: v${{ steps.version.outputs.current-version }}
                  name: v${{ steps.version.outputs.current-version }}
                  generate_release_notes: true
                  draft: false
                  prerelease: false
                  files: sbom.cdx.json
