name: 🐛 Bug Report
description: Report a bug to help us improve
title: '[BUG] '
labels:
    - bug
body:
    - type: markdown
      attributes:
          value: |
              Thanks for taking the time to file a bug report.
              ⚠️ **Do not report security vulnerabilities here.** Use the private security advisory link on the issue chooser.
    - type: checkboxes
      id: preflight
      attributes:
          label: Preflight checklist
          options:
              - label: I searched existing issues and this is not a duplicate.
                required: true
              - label: I read the relevant docs in the `/docs` folder.
                required: true
              - label: This is not a security vulnerability (those go through a private advisory).
                required: true
    - type: textarea
      id: description
      attributes:
          label: Description
          description: A clear and concise description of the bug.
      validations:
          required: true
    - type: textarea
      id: steps
      attributes:
          label: Steps to Reproduce
          placeholder: |
              1. ...
              2. ...
              3. ...
      validations:
          required: true
    - type: textarea
      id: expected
      attributes:
          label: Expected Behavior
          description: What you expected to happen.
      validations:
          required: true
    - type: textarea
      id: actual
      attributes:
          label: Actual Behavior
          description: What actually happened.
      validations:
          required: true
    - type: input
      id: module
      attributes:
          label: Affected module
          description: Comma-separated `src/modules/<name>` names, or `common` / `other`.
          placeholder: e.g. auth, session, common
      validations:
          required: true
    - type: dropdown
      id: entry-point
      attributes:
          label: Entry point
          options:
              - HTTP / endpoint
              - Queue / job
              - CLI
              - Other / unknown
      validations:
          required: true
    - type: input
      id: error-identity
      attributes:
          label: Error identity (if applicable)
          description: From the API error body — `statusCode`, `statusCodeKey`, and/or `messagePath`.
          placeholder: e.g. 51501 / userNotFound / user.error.notFound
      validations:
          required: false
    - type: textarea
      id: environment
      attributes:
          label: Environment
          description: Node, pnpm, Mongo setup, how you run the stack, and project version or commit. Engines are Node >= 24.15.0 and pnpm >= 10.25.0 (packageManager pin `pnpm@12.5.1`).
          placeholder: |
              OS: macOS 14
              Node: v24.15.0
              pnpm: 12.5.1
              Project: 9.0.0 / commit hash
              MongoDB: replica set (Compose) | standalone
              Running via: Docker Compose | manual
              Redis: (optional)
              Notes: e.g. after fresh `pnpm migration:seed`, specific `.env` values
      validations:
          required: true
    - type: textarea
      id: logs
      attributes:
          label: Relevant Logs / Error Output
          render: shell
      validations:
          required: false
    - type: textarea
      id: api
      attributes:
          label: API Request / Response (if applicable)
          render: shell
          placeholder: |
              # Request
              curl -X POST http://localhost:3000/api/v1/...

              # Response
              {
                "statusCode": 51501,
                "statusCodeKey": "userNotFound",
                "module": "user",
                "message": "..."
              }
      validations:
          required: false
    - type: textarea
      id: context
      attributes:
          label: Additional Context
          description: Screenshots, related issues, or anything else relevant.
      validations:
          required: false
