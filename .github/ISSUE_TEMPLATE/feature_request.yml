name: ✨ Feature Request
description: Suggest a new feature or improvement
title: '[FEAT] '
labels:
    - feature
body:
    - type: markdown
      attributes:
          value: |
              Thanks for suggesting an improvement.
              Large features should be discussed here **before** any implementation starts.
              Usage questions belong in [Discussions](https://github.com/andrechristikan/ack-nestjs-boilerplate/discussions), not issues.
    - type: checkboxes
      id: preflight
      attributes:
          label: Preflight checklist
          options:
              - label: I searched existing issues and this is not a duplicate.
                required: true
              - label: I read the relevant docs in the `/docs` folder.
                required: true
    - type: textarea
      id: problem
      attributes:
          label: Problem Statement
          description: What problem does this feature solve? Why is it needed?
      validations:
          required: true
    - type: textarea
      id: solution
      attributes:
          label: Proposed Solution
          description: Describe the feature you'd like.
      validations:
          required: true
    - type: input
      id: module
      attributes:
          label: Primary module
          description: Comma-separated `src/modules/<name>` names, or `common` / `new module` / `other`.
          placeholder: e.g. auth, workspace
      validations:
          required: true
    - type: dropdown
      id: entry-point
      attributes:
          label: Entry point
          options:
              - HTTP / endpoint
              - Queue / job
              - CLI
              - Other / unknown
      validations:
          required: true
    - type: textarea
      id: acceptance
      attributes:
          label: Acceptance Criteria
          description: What must be true for this feature to be considered complete?
          placeholder: |
              - [ ] ...
              - [ ] ...
      validations:
          required: true
    - type: textarea
      id: technical
      attributes:
          label: Technical notes (optional)
          description: API shape, Prisma/seed impact, `.env` keys, alternatives, or other design notes.
          placeholder: |
              API: METHOD /api/v1/path …
              Schema / seed: …
              Env: FOO_BAR=… (and `.env.example`)
              Alternatives: …
      validations:
          required: false
    - type: textarea
      id: context
      attributes:
          label: Additional Context
          description: Other modules touched, screenshots, references, related issues, or anything else relevant.
      validations:
          required: false
