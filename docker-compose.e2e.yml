name: ack-nestjs-e2e

services:
    postgres:
        image: postgres:18
        environment:
            POSTGRES_DB: ACKNestJsE2e
            POSTGRES_USER: ack
            POSTGRES_PASSWORD: ack_password
        ports:
            - '55432:5432'
        volumes:
            - ack_nestjs_e2e_postgres:/var/lib/postgresql
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ack -d ACKNestJsE2e']
            interval: 2s
            timeout: 5s
            retries: 15

    redis:
        image: redis:latest
        ports:
            - '56379:6379'
        volumes:
            - ack_nestjs_e2e_redis:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 2s
            timeout: 5s
            retries: 15

    jwks-server:
        image: nginx:alpine
        ports:
            - '5311:80'
        volumes:
            - ./keys/access-jwks.json:/usr/share/nginx/html/.well-known/access-jwks.json:ro
            - ./keys/refresh-jwks.json:/usr/share/nginx/html/.well-known/refresh-jwks.json:ro
            - ./ci/jwks-server/jwks.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
    ack_nestjs_e2e_postgres:
    ack_nestjs_e2e_redis:
