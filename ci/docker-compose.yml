# Run from the repository root: docker compose --env-file .env.docker -f ci/docker-compose.yml --profile deps up -d
# A release runs migrate and the application itself, so a release-managed instance starts deps alone. Without CI, add --profile apis to start migrate and apis; --profile vault starts Vault.
# The DOCKER_* variables are read from .env.docker. The eight required keys (the six credentials, DOCKER_APIS_UID, and DOCKER_APIS_GID) stop every command and name the one that is empty.
name: ack-nestjs-boilerplate

services:
    apis:
        build:
            context: ..
            dockerfile: ci/dockerfile
        profiles: ['apis']
        user: '${DOCKER_APIS_UID:?set DOCKER_APIS_UID in the compose variable file to the id of the host account that owns the root env file}:${DOCKER_APIS_GID:?set DOCKER_APIS_GID in the compose variable file to the group id of the host account that owns the root env file}'
        volumes:
            - type: bind
              source: ../.env
              target: /app/.env
              read_only: true
              bind:
                  create_host_path: false
        ports:
            - '127.0.0.1:3000:3000'
        read_only: true
        tmpfs:
            - /tmp
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        restart: unless-stopped
        networks:
            - app-network
        deploy:
            resources:
                limits:
                    cpus: '1.0'
                    memory: 1G
        depends_on:
            migrate:
                condition: service_completed_successfully
            postgres:
                condition: service_healthy
            redis-queue:
                condition: service_healthy
            redis-cache:
                condition: service_healthy
            jwks-server:
                condition: service_healthy
        healthcheck:
            test:
                [
                    'CMD',
                    'wget',
                    '--no-verbose',
                    '--tries=1',
                    '--spider',
                    'http://127.0.0.1:3000/api/public/hello',
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s

    migrate:
        build:
            context: ..
            dockerfile: ci/dockerfile
            target: migrate
        profiles: ['apis']
        user: '${DOCKER_APIS_UID:?set DOCKER_APIS_UID in the compose variable file to the id of the host account that owns the root env file}:${DOCKER_APIS_GID:?set DOCKER_APIS_GID in the compose variable file to the group id of the host account that owns the root env file}'
        volumes:
            - type: bind
              source: ../.env
              target: /app/.env
              read_only: true
              bind:
                  create_host_path: false
        restart: 'no'
        networks:
            - app-network
        depends_on:
            postgres:
                condition: service_healthy

    jwks-server:
        profiles: ['deps']
        image: nginx:1.30.5-alpine
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        cap_add:
            - CHOWN
            - SETGID
            - SETUID
        restart: unless-stopped
        volumes:
            - type: bind
              source: ../keys/access-jwks.json
              target: /usr/share/nginx/html/.well-known/access-jwks.json
              read_only: true
              bind:
                  create_host_path: false
            - type: bind
              source: ../keys/refresh-jwks.json
              target: /usr/share/nginx/html/.well-known/refresh-jwks.json
              read_only: true
              bind:
                  create_host_path: false
            - type: bind
              source: ./jwks-server/jwks.conf
              target: /etc/nginx/conf.d/default.conf
              read_only: true
              bind:
                  create_host_path: false
        networks:
            - app-network
        deploy:
            resources:
                limits:
                    cpus: '0.3'
                    memory: 128M
        healthcheck:
            test:
                [
                    'CMD',
                    'wget',
                    '-q',
                    '--spider',
                    'http://localhost:80/.well-known/access-jwks.json',
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s

    postgres:
        profiles: ['deps']
        image: postgres:18
        environment:
            POSTGRES_DB: ${DOCKER_POSTGRES_DB:?set DOCKER_POSTGRES_DB in .env.docker}
            POSTGRES_USER: ${DOCKER_POSTGRES_USER:?set DOCKER_POSTGRES_USER in .env.docker}
            POSTGRES_PASSWORD: ${DOCKER_POSTGRES_PASSWORD:?set DOCKER_POSTGRES_PASSWORD in .env.docker}
        volumes:
            - type: volume
              source: postgres_data
              target: /var/lib/postgresql
        restart: unless-stopped
        networks:
            - app-network
        deploy:
            resources:
                limits:
                    cpus: '1.0'
                    memory: 1G
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -q -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"',
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    redis-queue:
        profiles: ['deps']
        image: redis:8.8.3-alpine
        environment:
            REDIS_PASSWORD: ${DOCKER_REDIS_PASSWORD:?set DOCKER_REDIS_PASSWORD in .env.docker}
        user: redis
        command:
            [
                'sh',
                '-c',
                'if [ -n "$$REDIS_PASSWORD" ]; then exec redis-server --appendonly yes --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"; fi; exec redis-server --appendonly yes --maxmemory-policy noeviction',
            ]
        volumes:
            - type: volume
              source: redis_queue_data
              target: /data
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        restart: unless-stopped
        networks:
            - app-network
        deploy:
            resources:
                limits:
                    cpus: '0.5'
                    memory: 256M
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'if [ -n "$$REDIS_PASSWORD" ]; then export REDISCLI_AUTH="$$REDIS_PASSWORD"; fi; redis-cli ping | grep -q PONG',
                ]
            interval: 10s
            timeout: 10s
            retries: 5

    redis-cache:
        profiles: ['deps']
        image: redis:8.8.3-alpine
        environment:
            REDIS_PASSWORD: ${DOCKER_REDIS_PASSWORD:?set DOCKER_REDIS_PASSWORD in .env.docker}
        user: redis
        command:
            [
                'sh',
                '-c',
                'if [ -n "$$REDIS_PASSWORD" ]; then exec redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save "" --appendonly no --requirepass "$$REDIS_PASSWORD"; fi; exec redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save "" --appendonly no',
            ]
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        restart: unless-stopped
        networks:
            - app-network
        deploy:
            resources:
                limits:
                    cpus: '0.5'
                    memory: 384M
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'if [ -n "$$REDIS_PASSWORD" ]; then export REDISCLI_AUTH="$$REDIS_PASSWORD"; fi; redis-cli ping | grep -q PONG',
                ]
            interval: 10s
            timeout: 10s
            retries: 5

    bullboard:
        profiles: ['deps']
        image: venatum/bull-board:3.4.15
        environment:
            REDIS_HOST: redis-queue
            REDIS_PORT: '6379'
            REDIS_PASSWORD: ${DOCKER_REDIS_PASSWORD:?set DOCKER_REDIS_PASSWORD in .env.docker}
            BULL_PREFIX: Queue
            REDIS_DB: '0'
            USER_LOGIN: ${DOCKER_BULLBOARD_USERNAME:?set DOCKER_BULLBOARD_USERNAME in .env.docker}
            USER_PASSWORD: ${DOCKER_BULLBOARD_PASSWORD:?set DOCKER_BULLBOARD_PASSWORD in .env.docker}
        ports:
            - '127.0.0.1:3010:3000'
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        restart: unless-stopped
        networks:
            - app-network
        depends_on:
            redis-queue:
                condition: service_healthy
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'wget -q --spider http://127.0.0.1:3000/login || exit 1',
                ]
            interval: 10s
            timeout: 10s
            retries: 5
        deploy:
            resources:
                limits:
                    cpus: '0.3'
                    memory: 128M

    vault:
        image: hashicorp/vault:2.1.1
        profiles: ['vault']
        cap_add:
            - IPC_LOCK
        entrypoint: ['/bin/sh', '/vault/entrypoint.sh']
        restart: unless-stopped
        volumes:
            - type: bind
              source: ./vault/entrypoint.sh
              target: /vault/entrypoint.sh
              read_only: true
              bind:
                  create_host_path: false
            - type: bind
              source: ./vault/config.hcl
              target: /vault/config.hcl
              read_only: true
              bind:
                  create_host_path: false
            - type: volume
              source: vault_data
              target: /vault/file
            - type: bind
              source: ../generated/vault
              target: /vault/init
              bind:
                  create_host_path: true
        networks:
            vault-network:
                aliases:
                    - vault
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    "wget -q -O- 'http://127.0.0.1:8200/v1/sys/health?standbycode=200' >/dev/null 2>&1 || exit 1",
                ]
            interval: 5s
            timeout: 3s
            retries: 15
            start_period: 5s

    vault-bootstrap:
        image: hashicorp/vault:2.1.1
        profiles: ['vault']
        entrypoint: ['/bin/sh', '/bootstrap.sh']
        environment:
            VAULT_ADDR: http://vault:8200
            KV_MOUNT: ack-nestjs-boilerplate
        volumes:
            - type: bind
              source: ./vault/bootstrap.sh
              target: /bootstrap.sh
              read_only: true
              bind:
                  create_host_path: false
            - type: bind
              source: ./vault/policies
              target: /policies
              read_only: true
              bind:
                  create_host_path: false
            - type: bind
              source: ../generated/vault
              target: /vault/init
              bind:
                  create_host_path: true
        networks:
            - vault-network
        depends_on:
            vault:
                condition: service_healthy

networks:
    app-network:
        name: app-network
    vault-network:

volumes:
    postgres_data:
    redis_queue_data:
    vault_data:
